# Target Python version for Odoo 19
target-version = "py312"

# Standard Odoo line length limit
line-length = 88

exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "custom_addons/ica_web_responsive/**",
]

[lint]
select = ["E", "F", "W", "I", "B"]

ignore = [
    "E501", # Line too long
    "B008", # Function call in default argument
    "E741", # Ambiguous variable name
    "B023", # Function definition does not bind loop variable
    "SIM102", # Nested if statements
]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"__manifest__.py" = ["B018"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"